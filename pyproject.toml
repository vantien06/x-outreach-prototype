[project]
name = "warm-outreach"
version = "0.1.0"
description = "Find AI/robotics people on X, draft evidence-grounded DMs, send only after human approval."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "cryptography>=43",
    "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
